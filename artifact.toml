kind = "web"
previewPath = "/"
title = "FUTURERECEİPT Digital Receipts"
description = "A digital receipt platform for shoppers and small businesses around the world, with customer QR identities, merchant POS receipts, spending insights, and paper-saving impact tracking. Receipt amounts currently display in USD, and merchants configure one U.S. sales-tax rate per store."
version = "1.0.0"
id = "artifacts/ecobill"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23866

[services.development]
run = "pnpm --filter @workspace/ecobill run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecobill", "run", "build" ]
serve = "static"
publicDir = "artifacts/ecobill/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23866"
BASE_PATH = "/"
